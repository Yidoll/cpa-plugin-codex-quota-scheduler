handle_enabled: true
# Default-on active-selection policy. Only normalized "free" is free. Empty
# plans are unknown and are not actively selected. If all eligible request
# candidates are known free, the filter is relaxed for that request. Set false
# to restore the v0.3.x active-selection behavior; CPA fallback may still select
# an original free or unknown candidate.
exclude_free_accounts: true
quota_refresh_interval: 30m
stale_after: 5h
refresh_active_window: 1h
refresh_after_reset_delay: 1m
refresh_retry_delays: 1m,5m,15m
refresh_on_startup: false

# Strategy values explicitly present in lifecycle YAML override persisted
# Management settings. Omitted fields retain their persisted values. Set this
# field to an empty value or null to override the effective strategy for this
# lifecycle and restore legacy monthly_mode ordering. This does not delete the
# saved Management setting; omitting the field later restores that saved value.
# Supported values: quota_high, quota_low, subscription_high, subscription_low,
# expiry_soon.
selection_strategy: ""

# Required for subscription_high and subscription_low. Explicit lifecycle YAML
# overrides the persisted order; omission retains it, while [] or null makes the
# effective order empty for this lifecycle without deleting the saved setting.
# Values are ordered from low to high, normalized to lowercase, and unique.
subscription_order:
  - free
  - plus
  - pro

monthly_mode: expiry_order
fallback: fill-first
enable_usage_feedback: true
enable_reset_probe: false
probe_on_provisional_roster: false
# Until CPA confirms the authoritative roster, status is WaitingRoster and the
# plugin safely falls back without replacing the configured selection strategy.
max_refresh_concurrency: 1
quota_endpoint: https://chatgpt.com/backend-api/wham/usage
circuit_failure_threshold: 5
circuit_open_duration: 30m
circuit_half_open_success_threshold: 2
max_log_entries: 200
log_retention: 24h
