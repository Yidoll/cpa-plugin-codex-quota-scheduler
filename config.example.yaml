handle_enabled: true
quota_refresh_interval: 30m
stale_after: 5h
refresh_active_window: 1h
refresh_after_reset_delay: 1m
refresh_retry_delays: 1m,5m,15m
refresh_on_startup: false

# Leave empty to preserve the legacy monthly_mode ordering. Supported values:
# quota_high, quota_low, subscription_high, subscription_low, expiry_soon.
selection_strategy: ""

# Required for subscription_high and subscription_low. Values are ordered from
# low to high, normalized to lowercase, and must be unique.
subscription_order:
  - free
  - plus
  - pro

monthly_mode: expiry_order
fallback: fill-first
enable_usage_feedback: true
enable_reset_probe: false
probe_on_provisional_roster: false
max_refresh_concurrency: 1
quota_endpoint: https://chatgpt.com/backend-api/wham/usage
circuit_failure_threshold: 5
circuit_open_duration: 30m
circuit_half_open_success_threshold: 2
max_log_entries: 200
log_retention: 24h
